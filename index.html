<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <link href="/src/style.css" rel="stylesheet">
          <script type="module" src="./src/main.js"></script>
    <title>windbnb-pamesuarez</title>
  </head>
  <body class="ml-3 mr-3 dark:bg-stone-600">
<header class="flex flex-col items-start md:flex-row md:justify-between md:items-center p-6 gap-6">    
    <img src="./src/images/icons/logo-f7862584.svg" alt="Windbnb Logo" class="h-6">
    <button id="darkMode" class="absolute px-30 hover:scale-110">🌙</button>
    
    <nav class="flex items-center bg-white shadow-sm dark:bg-stone-800 border border-gray-100 dark:border-white rounded-full  max-w-2xl">
      
      <div class="px-4 py-2 flex-1">
        <!-- Location Filter -->
        <label class="block text-xs font-bold text-gray-800 dark:text-white  px-2">LOCATION</label>
        <input id="inputFilter" class="w-full outline-none text-gray-600  dark:text-gray-400 dark:font-semibold bg-transparent" type="text" placeholder="Add location 🌍">
      </div>

      <div class="border-l border-gray-200 dark:border-white h-10"></div>

      <!-- Guest Filter -->
       
      <div id="showMenu" class="px-4 py-2 flex-1 relative">
        <label class="block text-xs font-bold text-gray-800  dark:text-white px-2">GUESTS</label>
        <input id="input1" class="w-full outline-none text-gray-600  dark:text-gray-400 dark:font-semibold bg-transparent cursor-pointer" type="text" value="Add guests" readonly>
        <section id="guestMenu" class=" absolute shadow-sm botder border-gray-100 dark:border-white dark:bg-[#19191ac9] dark:text-white border-2 h-45 bg-[#ffffffc5] w-35 hidden">
          <div class="mt-3 ml-8">
            <h2 class="font-bold mb-0.5">Adults</h2>
            <button id="adultMinus" class="border-2 bg-amber-300 hover:scale-110"> ➖ </button>
            <span id="adultCount" class="w-4 text-center font-semibold text-gray-800 dark:text-white ml-1 mr-1">0</span>
            <button id="adultAdd" class="border-2 bg-amber-300 hover:scale-110"> ➕ </button>            
          </div>
          <div class="mt-3 ml-8">
            <h2 class="font-bold mb-0.5">Children</h2>
             <button id="childMinus" class="border-2 bg-amber-300 hover:scale-110"  class="border-2 bg-amber-300"> ➖ </button>
                         <span id="childCount" class="w-4 text-center font-semibold text-gray-800 dark:text-white ml-1 mr-1">0</span>
            <button id="childAdd" class="border-2 bg-amber-300 hover:scale-110"> ➕ </button> 
          </div>
        <button id="hideMenu" class="border-2 rounded-full bg-red-700 text-white w-20 mt-2.5 ml-7.5 font-bold hover:scale-110">UPDATE</button>
        </section>   
        
      </div>
          </nav>

  </header>

   <!-- Main Content Section -->

    <main class="flex flex-col items-center md:flex-row gap-4 mb-5 justify-between"> 

      <div id="productId" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 bg-amber-50 dark:bg-stone-600 w-full rounded-m"></div>
    
    </main>
  
    </body>
</html>
